<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyFriends | Bem-vindo!</title>
  
  <meta property="og:title" content="MyFriends | Bem-vindo!">
  <meta property="og:image" content="https://myfriends.pt/imagem-partilha.jpg">
  
  <!-- Fontes Oficiais -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- O teu CSS principal -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Design Limpo - Landing Page Style */
    body {
      background-color: #f7f9fa;
    }
    .landing-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .landing-header img {
      height: 50px;
      margin-bottom: 40px;
    }
    .landing-content {
      background: #ffffff;
      padding: 50px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      max-width: 500px;
      width: 100%;
    }
    
    /* Celebração visual no título */
    .landing-content h1 {
      font-family: 'Clash Display', sans-serif;
      color: #38383d;
      font-size: 36px;
      margin-bottom: 15px;
      line-height: 1.1;
    }
    .landing-content h1 span {
      color: #d70f15; /* Vermelho MyFriends para destacar a palavra principal */
    }
    
    .landing-content p {
      color: #6e7d8c;
      margin-bottom: 40px;
      line-height: 1.6;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="landing-wrapper">
    <!-- Logotipo que regressa ao site principal -->
    <header class="landing-header">
      <a href="index.html">
        <img src="myfriends-logo.svg" alt="MyFriends">
      </a>
    </header>

    <!-- Caixa Branca Central -->
    <main class="landing-content">
      <h1>Inscrição <span>Confirmada!</span></h1>
      <p>Bem-vindo à comunidade. Como prometido, aqui está o teu guia completo para começares o percurso prático com o teu grupo. Boas descobertas!</p>
      
      <!-- O LINK PARA O TEU PDF FICA AQUI -->
      <a href="https://drive.google.com/file/d/1TvFjOyexWEZo78TR4Gvaxrp7V1ypUIX6/view?usp=drive_link" target="_blank" rel="noopener" class="btn-primary" style="display: block; width: 100%; padding: 18px; font-size: 16px;">Descarregar Guia (PDF)</a>
      
      <!-- Link discreto para voltar ao site -->
      <p style="margin-top: 30px; margin-bottom: 0; font-size: 14px;">
        <a href="index.html" style="color: #6e7d8c; text-decoration: underline;">Voltar à página principal</a>
      </p>
    </main>
  </div>

</body>
</html>
